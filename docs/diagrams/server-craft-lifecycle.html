<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Flock craft lifecycle</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #111111;
      --color-ink:     #eeeeee;
      --color-muted:   #aaaaaa;
      --color-accent:  #4fc3f7;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Lifecycle · Players and enemies</p>
    <h1>Players and enemies, from spawn to wreck</h1>

    <div class="diagram-container">

        <title id="flock-craft-lifecycle-title">The Flock craft lifecycle</title>
        <desc id="flock-craft-lifecycle-desc">Enemies wake and sleep depending on whether a player is near. Players connect, fly and may disconnect. Both end as Destroyed, are removed 500 ms later, and a player then gets a new craft.</desc>

          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#aaaaaa"/></marker>

          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9db4d6"/></marker>
        </defs>

        <rect x="0" y="0" width="960" height="500" fill="#111111"/>

        <!-- arrows -->
        <path d="M 66,120 H 160" fill="none" stroke="#aaaaaa" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 304,108 H 400" fill="none" stroke="#aaaaaa" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 400,132 H 304" fill="none" stroke="#aaaaaa" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 560,120 H 660 Q 668,120 668,128 V 168" fill="none" stroke="#aaaaaa" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 232,88 V 68 Q 232,60 240,60 H 704 Q 712,60 712,68 V 168" fill="none" stroke="#aaaaaa" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 66,280 H 160" fill="none" stroke="#aaaaaa" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 304,280 H 400" fill="none" stroke="#aaaaaa" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 560,280 H 682 Q 690,280 690,272 V 232" fill="none" stroke="#aaaaaa" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 480,312 V 352" fill="none" stroke="#aaaaaa" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 760,200 H 840" fill="none" stroke="#aaaaaa" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 880,232 V 388 Q 880,396 872,396 H 240 Q 232,396 232,388 V 312" fill="none" stroke="#aaaaaa" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <!-- arrow labels -->
        <rect x="95" y="100" width="36" height="12" rx="2" fill="#111111"/>

        <rect x="318" y="90" width="68" height="12" rx="2" fill="#111111"/>
        <text x="352" y="99" fill="#aaaaaa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PLAYER NEAR</text>
        <rect x="318" y="138" width="68" height="12" rx="2" fill="#111111"/>
        <text x="352" y="147" fill="#aaaaaa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PLAYER AWAY</text>
        <rect x="588" y="102" width="52" height="12" rx="2" fill="#111111"/>
        <text x="614" y="111" fill="#aaaaaa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SHIELD 0</text>
        <rect x="436" y="42" width="80" height="12" rx="2" fill="#111111"/>
        <text x="476" y="51" fill="#aaaaaa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SHOT OR BLAST</text>
        <rect x="89" y="262" width="48" height="12" rx="2" fill="#111111"/>
        <text x="113" y="271" fill="#aaaaaa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CONNECT</text>
        <rect x="312" y="262" width="80" height="12" rx="2" fill="#111111"/>
        <text x="352" y="271" fill="#aaaaaa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FIRST MESSAGE</text>
        <rect x="594" y="262" width="52" height="12" rx="2" fill="#111111"/>
        <text x="620" y="271" fill="#aaaaaa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SHIELD 0</text>
        <rect x="488" y="326" width="64" height="12" rx="2" fill="#111111"/>
        <text x="520" y="335" fill="#aaaaaa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DISCONNECT</text>
        <rect x="776" y="182" width="48" height="12" rx="2" fill="#111111"/>
        <text x="800" y="191" fill="#aaaaaa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">+500 MS</text>
        <rect x="536" y="402" width="48" height="12" rx="2" fill="#111111"/>
        <text x="560" y="411" fill="#aaaaaa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RESPAWN</text>
        <!-- states -->
        <circle cx="60" cy="120" r="6" fill="#eeeeee"/>
        <circle cx="60" cy="280" r="6" fill="#eeeeee"/>
        <circle cx="480" cy="360" r="8" fill="none" stroke="#eeeeee" stroke-width="1.2"/>
        <circle cx="480" cy="360" r="5" fill="#eeeeee"/>

        <text x="188" y="105" fill="#eeeeee" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENEMY</text>
        <text x="232" y="128" fill="#eeeeee" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Idle</text>
        <text x="232" y="144" fill="#aaaaaa" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">asleep · shootable</text>
        <rect x="400" y="88" width="160" height="64" rx="6" fill="#111111"/>
        <rect x="400" y="88" width="160" height="64" rx="6" fill="#1b1b1b" stroke="#eeeeee" stroke-width="1"/>
        <rect x="408" y="96" width="40" height="12" rx="2" fill="transparent" stroke="rgba(238,238,238,0.40)" stroke-width="0.8"/>

        <text x="480" y="128" fill="#eeeeee" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Active</text>
        <text x="480" y="144" fill="#aaaaaa" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">chase · strafe · fire</text>
        <rect x="160" y="248" width="144" height="64" rx="6" fill="#111111"/>

        <rect x="168" y="256" width="44" height="12" rx="2" fill="transparent" stroke="rgba(238,238,238,0.40)" stroke-width="0.8"/>
        <text x="190" y="265" fill="#eeeeee" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PLAYER</text>
        <text x="232" y="288" fill="#eeeeee" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Connected</text>
        <text x="232" y="304" fill="#aaaaaa" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">socket · no craft</text>
        <rect x="400" y="248" width="160" height="64" rx="6" fill="#111111"/>
        <rect x="400" y="248" width="160" height="64" rx="6" fill="#1b1b1b" stroke="#eeeeee" stroke-width="1"/>
        <rect x="408" y="256" width="44" height="12" rx="2" fill="transparent" stroke="rgba(238,238,238,0.40)" stroke-width="0.8"/>
        <text x="430" y="265" fill="#eeeeee" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PLAYER</text>
        <text x="480" y="288" fill="#eeeeee" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Flying</text>
        <text x="480" y="304" fill="#aaaaaa" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">craft in the world</text>
        <rect x="620" y="168" width="140" height="64" rx="6" fill="#111111"/>
        <rect x="620" y="168" width="140" height="64" rx="6" fill="rgba(79,195,247,0.10)" stroke="#4fc3f7" stroke-width="1"/>
        <rect x="628" y="176" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,195,247,0.50)" stroke-width="0.8"/>
        <text x="646" y="185" fill="#4fc3f7" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BOTH</text>
        <text x="690" y="208" fill="#eeeeee" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Destroyed</text>
        <text x="690" y="224" fill="#aaaaaa" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">frozen · drop · blast</text>
        <rect x="840" y="168" width="80" height="64" rx="6" fill="#111111"/>
        <rect x="840" y="168" width="80" height="64" rx="6" fill="#1b1b1b" stroke="#eeeeee" stroke-width="1"/>
        <rect x="848" y="176" width="36" height="12" rx="2" fill="transparent" stroke="rgba(238,238,238,0.40)" stroke-width="0.8"/>
        <text x="866" y="185" fill="#eeeeee" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BOTH</text>
        <text x="880" y="212" fill="#eeeeee" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Removed</text>
        <!-- legend -->
        <line x1="40" y1="444" x2="920" y2="444" stroke="rgba(238,238,238,0.10)" stroke-width="0.8"/>
        <text x="40" y="460" fill="#aaaaaa" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
        <circle cx="45" cy="481" r="4" fill="#eeeeee"/>
        <text x="60" y="484" fill="#aaaaaa" font-size="8.5" font-family="'Geist', sans-serif">Start</text>
        <circle cx="125" cy="481" r="5" fill="none" stroke="#eeeeee" stroke-width="1"/><circle cx="125" cy="481" r="3" fill="#eeeeee"/>
        <text x="140" y="484" fill="#aaaaaa" font-size="8.5" font-family="'Geist', sans-serif">End</text>
        <rect x="200" y="476" width="14" height="10" rx="2" fill="#1b1b1b" stroke="#eeeeee" stroke-width="1"/>
        <text x="220" y="484" fill="#aaaaaa" font-size="8.5" font-family="'Geist', sans-serif">State</text>
        <rect x="288" y="476" width="14" height="10" rx="2" fill="rgba(79,195,247,0.10)" stroke="#4fc3f7" stroke-width="1"/>
        <text x="308" y="484" fill="#aaaaaa" font-size="8.5" font-family="'Geist', sans-serif">Where both craft end up</text>
        <line x1="480" y1="481" x2="508" y2="481" stroke="#aaaaaa" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="516" y="484" fill="#aaaaaa" font-size="8.5" font-family="'Geist', sans-serif">Player gets a new craft</text>
      </svg>
    </div>
  </div>
</body>
</html>
